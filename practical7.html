<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KM to M Converter</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9f9f9;
    }
    .box {
      background: white;
      padding: 2px;
      border-radius: 8px;
      text-align: center;
    }
    input {
      padding: 0.5rem;
      font-size: 1rem;
      width: 150px;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="box">
    <input type="number" id="kmInput" placeholder="Enter km" >
    <p><span id="mOutput">0</span> meters</p>
  </div>

  <script>
    const kmInput = document.getElementById('kmInput');
    const mOutput = document.getElementById('mOutput');

    kmInput.addEventListener('input', () => {
      const km = parseFloat(kmInput.value);
      mOutput.textContent = isNaN(km) ? 0 : km * 1000;
    });
  </script>

</body>
</html>
