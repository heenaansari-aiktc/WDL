<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Button</title>
  <style>
    /* 1. Base Button Styling */
    .btn {
      padding: 12px 24px;
      font-size: 16px;
      color: white;
      background-color: #2563eb; /* Blue */
      border: none;
      border-radius: 6px;
      cursor: pointer;
      
      /* Smoothly animates color and size changes */
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    /* 2. Hover Effect (CSS) */
    .btn:hover {
      background-color: #d81d1d; /* Darker Blue */
      transform: scale(1.08);    /* Grows 8% larger */
    }

    /* 3. Click State Class (Toggled by JavaScript) */
    .btn.clicked {
      background-color: #16a34a; /* Green */
      transform: scale(0.95);    /* Shrinks slightly for click feedback */
    }
  </style>
</head>
<body>

  <button id="actionBtn" class="btn">Click Me</button>

  <script>
    const button = document.getElementById('actionBtn');

    // JavaScript Event Handling
    button.addEventListener('click', () => {
      // Toggle the 'clicked' class on and off
      button.classList.toggle('clicked');
    });
  </script>

</body>
</html>
